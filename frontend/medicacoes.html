<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicações - Sentinela</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-shell{width:min(1120px,calc(100% - 28px));margin:34px auto}
    .hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:25px 28px;background:linear-gradient(135deg,#0b2741,#174f78);border-radius:22px;color:white;box-shadow:0 22px 55px rgba(11,39,65,.18);margin-bottom:20px;position:relative;overflow:hidden}
    .hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(85,183,217,.16);right:-90px;top:-120px}
    .brand{display:flex;align-items:center;gap:15px;position:relative;z-index:1}.brand img{width:58px;height:58px;border-radius:16px;background:white;padding:7px}.hero h1{margin:0;color:white;font-size:27px}.hero p{margin:5px 0 0;color:#cfe3ef;font-size:14px}
    .counter{position:relative;z-index:1;padding:9px 13px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.11);border-radius:999px;font-size:12px;font-weight:800}
    .list-panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px}
    .section-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
    #listaMedicacoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    #listaMedicacoes .card{margin:0;padding:20px 20px 18px}
    #listaMedicacoes .card h3{font-size:17px;padding-right:30px}
    #listaMedicacoes .card p{padding:7px 0;border-bottom:1px solid #edf2f5;margin:0}
    #listaMedicacoes .card p:last-child{border-bottom:0}
    .empty-state{grid-column:1/-1;padding:38px;text-align:center;border:1px dashed #b9cad6;border-radius:16px;background:#f8fbfd;color:var(--muted)}
    @media(max-width:760px){#listaMedicacoes{grid-template-columns:1fr}.counter{display:none}.page-shell{margin:18px auto}.list-panel{padding:18px}}
  
        /* Sentinela restyle v3 */

    body{background:linear-gradient(180deg,#edf5f9 0%,#e8f0f5 100%)}
    .page-shell{max-width:1180px;margin-top:18px}
    .hero{
      min-height:148px;
      padding:30px 32px;
      border-radius:26px;
      background:
        radial-gradient(circle at 88% 20%,rgba(103,198,228,.22),transparent 19rem),
        linear-gradient(135deg,#081f34 0%,#0f3f63 58%,#17648a 100%);
      box-shadow:0 28px 70px rgba(8,31,52,.20)
    }
    .brand img{width:64px;height:64px;border-radius:18px}
    .hero h1{font-size:30px;letter-spacing:-.04em}
    .list-panel{border-radius:23px;padding:27px;box-shadow:0 18px 48px rgba(16,45,70,.09)}
    .section-head{padding-bottom:16px;border-bottom:1px solid #edf2f5}
    #listaMedicacoes{gap:16px}
    #listaMedicacoes .card{border-radius:18px;padding:22px 21px;transition:.18s ease}
    #listaMedicacoes .card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(16,45,70,.10)}

    
        /* Sentinela redesign v4 */

    .sn-topbar{max-width:1180px!important;background:#0b2741!important;border:0!important}
    .sn-back{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.12)!important;color:#fff!important}
    .sn-page-label{color:#c6d9e5!important}
    .hero{border-radius:28px!important;min-height:165px!important}
    .list-panel{border-radius:24px!important}
    #listaMedicacoes{grid-template-columns:repeat(3,minmax(0,1fr))!important}
    #listaMedicacoes .card{
      border-radius:18px!important;background:#f8fbfd!important;border:1px solid #dfe9ef!important;
      box-shadow:none!important
    }
    #listaMedicacoes .card:hover{background:#fff!important}
    @media(max-width:1000px){#listaMedicacoes{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
    @media(max-width:680px){#listaMedicacoes{grid-template-columns:1fr!important}}

    </style>
</head>
<body>
  <nav class="sn-topbar">
    <a class="sn-back" href="index.html">← Voltar para o login</a>
    <div class="sn-page-label"><span class="sn-page-dot"></span>Prescrições • Medicações</div>
  </nav>

<main class="page-shell">
  <section class="hero">
    <div class="brand"><img src="logo-sh.png" alt="Sentinela"><div><h1>Medicações Prescritas</h1><p>Acompanhamento das prescrições registradas nas consultas</p></div></div>
    <span class="counter">SENTINELA • PRESCRIÇÕES</span>
  </section>

  <section class="list-panel">
    <div class="section-head"><div><h2>Prescrições recentes</h2><p>Paciente, medicamento, diagnóstico e observações clínicas.</p></div></div>
    <div id="listaMedicacoes"><div class="empty-state">Carregando prescrições...</div></div>
  </section>
</main>

<script>
function carregarMedicacoesPrescritas() {
  fetch("/medicacoes")
    .then(r => r.json())
    .then(data => {
      const div = document.getElementById("listaMedicacoes");
      div.innerHTML = "";
      if (data.length === 0) {
        div.innerHTML = '<div class="empty-state">Nenhuma medicação prescrita até o momento.</div>';
        return;
      }
      data.forEach(c => {
        div.innerHTML += `
          <div class="card">
            <h3>${c.paciente}</h3>
            <p><b>Medicação:</b> ${c.medicacao}</p>
            <p><b>Diagnóstico:</b> ${c.diagnostico}</p>
            <p><b>Observações:</b> ${c.obs || "Nenhuma"}</p>
          </div>
        `;
      });
    });
}
carregarMedicacoesPrescritas();
</script>
</body>
</html>
