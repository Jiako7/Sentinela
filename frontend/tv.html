
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TV - Sistema Hospitalar</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #0f2742,
                    #164e70
                );

            color: #ffffff;

        }


        /* =========================================
           CONTAINER PRINCIPAL
        ========================================= */

        .tv-container {

            width: 94vw;
            height: 92vh;

            margin: auto;

            display: grid;

            grid-template-columns: 30% 70%;

            gap: 20px;

        }


        /* =========================================
           PAINEL ESQUERDO
        ========================================= */

        .left-panel {

            display: grid;

            grid-template-rows: 1fr 1fr;

            gap: 20px;

        }


        /* =========================================
           PAINEL DIREITO
        ========================================= */

        .right-panel {

            display: grid;

            grid-template-rows: 3fr 1fr;

            gap: 20px;

        }


        /* =========================================
           BOX PADRÃO
        ========================================= */

        .box {

            position: relative;

            background: rgba(255,255,255,0.97);

            border-radius: 20px;

            border: 1px solid rgba(255,255,255,0.5);

            box-shadow:
                0 12px 35px rgba(0,0,0,0.25);

            overflow: hidden;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

        }


        /* Pequena faixa superior */

        .box::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 7px;

            background: #2d8ac7;

        }


        /* =========================================
           TÍTULOS
        ========================================= */

        .box-title {

            color: #40566b;

            font-size: 1.8vw;

            font-weight: 700;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 15px;

        }


        /* =========================================
           LOCAL
        ========================================= */

        .local-box {

            padding: 25px;

        }


        .local-type {

            color: #40566b;

            font-size: 2vw;

            font-weight: 700;

            letter-spacing: 1px;

            margin-bottom: 8px;

        }


        .local-number {

            color: #176da5;

            font-size: 9vw;

            font-weight: 800;

            line-height: 0.95;

        }


        /* =========================================
           HISTÓRICO
        ========================================= */

        .history-box {

            justify-content: flex-start;

            align-items: stretch;

            padding: 25px;

        }


        .history-box .box-title {

            text-align: center;

            font-size: 1.45vw;

            margin-bottom: 18px;

        }


        #history-list {

            list-style: none;

            width: 100%;

            color: #40566b;

            font-size: 1.35vw;

            font-weight: 600;

        }


        #history-list li {

            padding: 11px 5px;

            border-bottom: 1px solid #e2e8ee;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        #history-list li:last-child {

            border-bottom: none;

        }


        /* =========================================
           PACIENTE
        ========================================= */

        .patient-box {

            padding: 35px;

        }


        .patient-box .box-title {

            font-size: 2vw;

            margin-bottom: 25px;

        }


        .patient-name {

            width: 95%;

            color: #176da5;

            font-size: 6vw;

            font-weight: 800;

            line-height: 1.05;

            text-transform: uppercase;

            overflow-wrap: anywhere;

        }


        /* =========================================
           LOGO
        ========================================= */

        .logo-box {

            padding: 20px;

        }


        .logo-text {

            color: #40566b;

            font-size: 2.5vw;

            font-weight: 800;

            letter-spacing: 2px;

        }


        .logo-subtitle {

            margin-top: 7px;

            color: #8494a3;

            font-size: 1vw;

            letter-spacing: 1px;

            text-transform: uppercase;

        }


        /* =========================================
           INDICADOR DE STATUS
        ========================================= */

        .status-indicator {

            position: absolute;

            right: 18px;
            top: 18px;

            display: flex;

            align-items: center;

            gap: 7px;

            color: #5d7183;

            font-size: 0.85vw;

            font-weight: 600;

        }


        .status-dot {

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #27ae60;

            box-shadow:
                0 0 0 4px rgba(39,174,96,0.12);

        }


        /* =========================================
           ANIMAÇÃO DA NOVA CHAMADA
        ========================================= */

        @keyframes flash {

            0% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.015);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.015);
            }

            60% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }

        }


        .flash {

            animation:
                flash 0.6s ease 3;

        }


        /* =========================================
           BRILHO DA CHAMADA
        ========================================= */

        .patient-box.flash::after {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: 20px;

            border: 5px solid #2d8ac7;

            pointer-events: none;

            animation:
                pulseBorder 0.6s ease 3;

        }


        @keyframes pulseBorder {

            0% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }

        }


        /* =========================================
           RESPONSIVIDADE
        ========================================= */

        @media (max-width: 900px) {

            .tv-container {

                width: 96vw;
                height: 94vh;

                grid-template-columns: 1fr;

            }

            .left-panel {

                display: none;

            }

            .right-panel {

                grid-template-rows: 4fr 1fr;

            }

            .patient-name {

                font-size: 10vw;

            }

            .patient-box .box-title {

                font-size: 4vw;

            }

            .logo-text {

                font-size: 5vw;

            }

        }


    </style>

</head>


<body>


    <!-- =========================================
         ESTRUTURA PRINCIPAL
    ========================================== -->

    <div class="tv-container">


        <!-- =====================================
             ESQUERDA
        ====================================== -->

        <div class="left-panel">


            <!-- LOCAL -->

            <div class="box local-box">

                <div class="status-indicator">

                    <span class="status-dot"></span>

                    SISTEMA ATIVO

                </div>


                <div
                    class="box-title"
                    id="local-tipo">

                    GUICHÊ

                </div>


                <div
                    class="local-number"
                    id="local-numero">

                    --

                </div>

            </div>


            <!-- HISTÓRICO -->

            <div class="box history-box">

                <div class="box-title">

                    Últimas chamadas

                </div>


                <ul id="history-list"></ul>

            </div>


        </div>


        <!-- =====================================
             DIREITA
        ====================================== -->

        <div class="right-panel">


            <!-- PACIENTE -->

            <div class="box patient-box">


                <div class="status-indicator">

                    <span class="status-dot"></span>

                    CHAMADA

                </div>


                <div class="box-title">

                    Paciente

                </div>


                <div
                    class="patient-name"
                    id="patient-name">

                    AGUARDANDO...

                </div>


            </div>


            <!-- LOGO -->

            <div class="box logo-box">

                <div class="logo-text">

                    🏥 Sistema Hospitalar

                </div>


                <div class="logo-subtitle">

                    Atendimento e Gestão Hospitalar

                </div>

            </div>


        </div>


    </div>



<script>


    /* =========================================
       CONTROLE DA ÚLTIMA CHAMADA
    ========================================= */

    let ultimoId = null;



    /* =========================================
       ATUALIZAR TV
    ========================================= */

    function atualizar() {


        fetch("/tv/chamada")

            .then(r => {


                if (!r.ok) {

                    throw new Error(
                        "Erro ao buscar chamada."
                    );

                }


                return r.json();

            })


            .then(data => {


                const chamada =
                    data.chamada;


                const historico =
                    data.historico || [];



                /* =================================
                   CHAMADA ATUAL
                ================================= */

                if (chamada) {


                    document
                        .getElementById("local-tipo")
                        .innerText =
                        chamada.localTipo ||
                        "GUICHÊ";


                    document
                        .getElementById("local-numero")
                        .innerText =
                        chamada.localNumero ||
                        "--";


                    document
                        .getElementById("patient-name")
                        .innerText =
                        chamada.paciente ||
                        "AGUARDANDO...";



                    /* =============================
                       NOVA CHAMADA
                    ============================== */

                    if (
                        chamada.id !==
                        ultimoId
                    ) {


                        ultimoId =
                            chamada.id;


                        const patientBox =
                            document.querySelector(
                                ".patient-box"
                            );


                        patientBox
                            .classList
                            .remove("flash");


                        /*
                         * Força o navegador a
                         * reiniciar a animação.
                         */

                        void patientBox.offsetWidth;


                        patientBox
                            .classList
                            .add("flash");

                    }

                }



                /* =================================
                   HISTÓRICO
                ================================= */

                const list =
                    document.getElementById(
                        "history-list"
                    );


                list.innerHTML = "";



                historico
                    .slice(0, 4)
                    .forEach(h => {


                        const li =
                            document.createElement("li");


                        const tipo =
                            h.localTipo
                                ? h.localTipo.substring(0, 4)
                                : "GUIC";


                        li.innerText =
                            `${tipo}. ${h.localNumero} - ${h.paciente}`;


                        list.appendChild(li);

                    });


            })


            .catch(err => {

                console.log(
                    "Erro ao buscar chamada:",
                    err
                );

            });

    }



    /* =========================================
       PRIMEIRA ATUALIZAÇÃO
    ========================================= */

    atualizar();



    /* =========================================
       ATUALIZAÇÃO AUTOMÁTICA
       Mantido em 2 segundos
    ========================================= */

    setInterval(
        atualizar,
        2000
    );


</script>


</body>

</html>
```
