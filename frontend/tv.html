
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TV - Sistema Hospitalar</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #0f2742,
                    #164e70
                );

            color: #ffffff;

        }


        /* =========================================
           CONTAINER PRINCIPAL
        ========================================= */

        .tv-container {

            width: 94vw;
            height: 92vh;

            margin: auto;

            display: grid;

            grid-template-columns: 30% 70%;

            gap: 20px;

        }


        /* =========================================
           PAINEL ESQUERDO
        ========================================= */

        .left-panel {

            display: grid;

            grid-template-rows: 1fr 1fr;

            gap: 20px;

        }


        /* =========================================
           PAINEL DIREITO
        ========================================= */

        .right-panel {

            display: grid;

            grid-template-rows: 3fr 1fr;

            gap: 20px;

        }


        /* =========================================
           BOX PADRÃO
        ========================================= */

        .box {

            position: relative;

            background: rgba(255,255,255,0.97);

            border-radius: 20px;

            border: 1px solid rgba(255,255,255,0.5);

            box-shadow:
                0 12px 35px rgba(0,0,0,0.25);

            overflow: hidden;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

        }


        /* Pequena faixa superior */

        .box::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 7px;

            background: #2d8ac7;

        }


        /* =========================================
           TÍTULOS
        ========================================= */

        .box-title {

            color: #40566b;

            font-size: 1.8vw;

            font-weight: 700;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 15px;

        }


        /* =========================================
           LOCAL
        ========================================= */

        .local-box {

            padding: 25px;

        }


        .local-type {

            color: #40566b;

            font-size: 2vw;

            font-weight: 700;

            letter-spacing: 1px;

            margin-bottom: 8px;

        }


        .local-number {

            color: #176da5;

            font-size: 9vw;

            font-weight: 800;

            line-height: 0.95;

        }


        /* =========================================
           HISTÓRICO
        ========================================= */

        .history-box {

            justify-content: flex-start;

            align-items: stretch;

            padding: 25px;

        }


        .history-box .box-title {

            text-align: center;

            font-size: 1.45vw;

            margin-bottom: 18px;

        }


        #history-list {

            list-style: none;

            width: 100%;

            color: #40566b;

            font-size: 1.35vw;

            font-weight: 600;

        }


        #history-list li {

            padding: 11px 5px;

            border-bottom: 1px solid #e2e8ee;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        #history-list li:last-child {

            border-bottom: none;

        }


        /* =========================================
           PACIENTE
        ========================================= */

        .patient-box {

            padding: 35px;

        }


        .patient-box .box-title {

            font-size: 2vw;

            margin-bottom: 25px;

        }


        .patient-name {

            width: 95%;

            color: #176da5;

            font-size: 6vw;

            font-weight: 800;

            line-height: 1.05;

            text-transform: uppercase;

            overflow-wrap: anywhere;

        }


        /* =========================================
           LOGO
        ========================================= */

        .logo-box {

            padding: 20px;

        }


        .logo-text {

            color: #40566b;

            font-size: 2.5vw;

            font-weight: 800;

            letter-spacing: 2px;

        }


        .logo-subtitle {

            margin-top: 7px;

            color: #8494a3;

            font-size: 1vw;

            letter-spacing: 1px;

            text-transform: uppercase;

        }


        /* =========================================
           INDICADOR DE STATUS
        ========================================= */

        .status-indicator {

            position: absolute;

            right: 18px;
            top: 18px;

            display: flex;

            align-items: center;

            gap: 7px;

            color: #5d7183;

            font-size: 0.85vw;

            font-weight: 600;

        }


        .status-dot {

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #27ae60;

            box-shadow:
                0 0 0 4px rgba(39,174,96,0.12);

        }


        /* =========================================
           ANIMAÇÃO DA NOVA CHAMADA
        ========================================= */

        @keyframes flash {

            0% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.015);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.015);
            }

            60% {
                transform: scale(1);
            }

            100% {
                transform: scale(1);
            }

        }


        .flash {

            animation:
                flash 0.6s ease 3;

        }


        /* =========================================
           BRILHO DA CHAMADA
        ========================================= */

        .patient-box.flash::after {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: 20px;

            border: 5px solid #2d8ac7;

            pointer-events: none;

            animation:
                pulseBorder 0.6s ease 3;

        }


        @keyframes pulseBorder {

            0% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }

        }


        /* =========================================
           RESPONSIVIDADE
        ========================================= */

        @media (max-width: 900px) {

            .tv-container {

                width: 96vw;
                height: 94vh;

                grid-template-columns: 1fr;

            }

            .left-panel {

                display: none;

            }

            .right-panel {

                grid-template-rows: 4fr 1fr;

            }

            .patient-name {

                font-size: 10vw;

            }

            .patient-box .box-title {

                font-size: 4vw;

            }

            .logo-text {

                font-size: 5vw;

            }

        }


    
        /* ===== Sentinela Design System v2 ===== */
        :root{
            --sn-bg:#eef4f8;
            --sn-surface:#fff;
            --sn-navy:#0b2741;
            --sn-navy2:#123f66;
            --sn-blue:#2476b8;
            --sn-blue2:#2f8fd1;
            --sn-cyan:#55b7d9;
            --sn-teal:#0f766e;
            --sn-text:#142536;
            --sn-muted:#6b7f91;
            --sn-line:#dbe6ee;
            --sn-shadow:0 18px 50px rgba(16,45,70,.10);
            --sn-shadow-soft:0 8px 24px rgba(16,45,70,.07);
        }
        body{
            font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
            background:radial-gradient(circle at 12% 0%,rgba(85,183,217,.14),transparent 28rem),linear-gradient(180deg,#f8fbfd,var(--sn-bg));
            color:var(--sn-text);
        }
        body::before{
            content:"";
            position:fixed;
            inset:0 0 auto 0;
            height:4px;
            background:linear-gradient(90deg,var(--sn-navy),var(--sn-blue2),var(--sn-cyan),var(--sn-teal));
            z-index:9999;
        }
        input,select,textarea,button{font-family:inherit}

        body{
            background:
                radial-gradient(circle at 78% 15%,rgba(85,183,217,.20),transparent 32rem),
                linear-gradient(135deg,#071c2e,#0d3656 55%,#115071)!important;
        }
        .tv-container{width:95vw;height:92vh;gap:18px}
        .box{
            border-radius:24px;
            border:1px solid rgba(255,255,255,.72);
            box-shadow:0 24px 55px rgba(0,0,0,.24);
            background:linear-gradient(180deg,rgba(255,255,255,.99),rgba(245,250,253,.98));
        }
        .box::before{height:6px;background:linear-gradient(90deg,var(--sn-blue2),var(--sn-cyan),var(--sn-teal))}
        .box-title,.local-type,.logo-text{color:var(--sn-navy2)!important}
        .local-number,.patient-name{color:#1477ad!important;letter-spacing:-.035em}
        .history-box{padding:27px!important}
        #history-list li{border-bottom-color:#dce8ef!important;padding:13px 7px!important}
        .status-indicator{background:#edf8f2;padding:7px 10px;border-radius:999px;color:#47705e!important}
        .logo-box{background:linear-gradient(135deg,#fff,#edf8fd)}
        .logo-text{font-size:2.2vw!important}

    
        /* Sentinela TV back v3 */
        .tv-back{
            position:fixed;
            top:14px;
            left:18px;
            z-index:100;
            display:inline-flex;
            align-items:center;
            text-decoration:none;
            color:#dff3ff;
            background:rgba(6,28,46,.58);
            border:1px solid rgba(255,255,255,.16);
            border-radius:999px;
            padding:9px 13px;
            font-size:12px;
            font-weight:800;
            letter-spacing:.02em;
            backdrop-filter:blur(10px);
            transition:.18s ease;
        }
        .tv-back:hover{
            background:rgba(255,255,255,.12);
            transform:translateY(-1px);
        }
        .tv-container{
            padding-top:18px;
        }
    
        /* Sentinela restyle v3 */

        .tv-container{gap:22px!important}
        .box{
            border-radius:26px!important;
            box-shadow:0 28px 70px rgba(0,0,0,.25)!important
        }
        .patient-box{
            background:
                radial-gradient(circle at 88% 18%,rgba(85,183,217,.10),transparent 25rem),
                linear-gradient(180deg,#fff,#f5fbfe)!important
        }
        .patient-name{font-weight:900!important}
        .local-number{font-weight:900!important}
        .history-box{background:linear-gradient(180deg,#fff,#f7fbfd)!important}
        .logo-box{border-top:1px solid rgba(85,183,217,.18)!important}

    
        /* Sentinela redesign v4 */

        body{
          background:
            radial-gradient(circle at 75% 20%,rgba(54,159,199,.25),transparent 30rem),
            linear-gradient(135deg,#041522,#092d49 58%,#0d4d6c)!important;
        }
        .box{border-radius:30px!important}
        .patient-box{
          background:
            radial-gradient(circle at 85% 15%,rgba(47,143,209,.10),transparent 24rem),
            #fff!important;
        }
        .patient-name{color:#0d6fa2!important}
        .local-number{color:#0d6fa2!important}
        .logo-box{background:#0b2741!important}
        .logo-text{color:#fff!important}
        .logo-subtitle{color:#b8cfdd!important}

    </style>

</head>


<body>
    <a class="tv-back" href="javascript:history.back()">← Voltar</a>


    <!-- =========================================
         ESTRUTURA PRINCIPAL
    ========================================== -->

    <div class="tv-container">


        <!-- =====================================
             ESQUERDA
        ====================================== -->

        <div class="left-panel">


            <!-- LOCAL -->

            <div class="box local-box">

                <div class="status-indicator">

                    <span class="status-dot"></span>

                    SISTEMA ATIVO

                </div>


                <div
                    class="box-title"
                    id="local-tipo">

                    GUICHÊ

                </div>


                <div
                    class="local-number"
                    id="local-numero">

                    --

                </div>

            </div>


            <!-- HISTÓRICO -->

            <div class="box history-box">

                <div class="box-title">

                    Últimas chamadas

                </div>


                <ul id="history-list"></ul>

            </div>


        </div>


        <!-- =====================================
             DIREITA
        ====================================== -->

        <div class="right-panel">


            <!-- PACIENTE -->

            <div class="box patient-box">


                <div class="status-indicator">

                    <span class="status-dot"></span>

                    CHAMADA

                </div>


                <div class="box-title">

                    Paciente

                </div>


                <div
                    class="patient-name"
                    id="patient-name">

                    AGUARDANDO...

                </div>


            </div>


            <!-- LOGO -->

            <div class="box logo-box">

                <div class="logo-text">

                    🏥 Sistema Hospitalar

                </div>


                <div class="logo-subtitle">

                    Atendimento e Gestão Hospitalar

                </div>

            </div>


        </div>


    </div>



<script>


    /* =========================================
       CONTROLE DA ÚLTIMA CHAMADA
    ========================================= */

    let ultimoId = null;



    /* =========================================
       ATUALIZAR TV
    ========================================= */

    function atualizar() {


        fetch("/tv/chamada")

            .then(r => {


                if (!r.ok) {

                    throw new Error(
                        "Erro ao buscar chamada."
                    );

                }


                return r.json();

            })


            .then(data => {


                const chamada =
                    data.chamada;


                const historico =
                    data.historico || [];



                /* =================================
                   CHAMADA ATUAL
                ================================= */

                if (chamada) {


                    document
                        .getElementById("local-tipo")
                        .innerText =
                        chamada.localTipo ||
                        "GUICHÊ";


                    document
                        .getElementById("local-numero")
                        .innerText =
                        chamada.localNumero ||
                        "--";


                    document
                        .getElementById("patient-name")
                        .innerText =
                        chamada.paciente ||
                        "AGUARDANDO...";



                    /* =============================
                       NOVA CHAMADA
                    ============================== */

                    if (
                        chamada.id !==
                        ultimoId
                    ) {


                        ultimoId =
                            chamada.id;


                        const patientBox =
                            document.querySelector(
                                ".patient-box"
                            );


                        patientBox
                            .classList
                            .remove("flash");


                        /*
                         * Força o navegador a
                         * reiniciar a animação.
                         */

                        void patientBox.offsetWidth;


                        patientBox
                            .classList
                            .add("flash");

                    }

                }



                /* =================================
                   HISTÓRICO
                ================================= */

                const list =
                    document.getElementById(
                        "history-list"
                    );


                list.innerHTML = "";



                historico
                    .slice(0, 4)
                    .forEach(h => {


                        const li =
                            document.createElement("li");


                        const tipo =
                            h.localTipo
                                ? h.localTipo.substring(0, 4)
                                : "GUIC";


                        li.innerText =
                            `${tipo}. ${h.localNumero} - ${h.paciente}`;


                        list.appendChild(li);

                    });


            })


            .catch(err => {

                console.log(
                    "Erro ao buscar chamada:",
                    err
                );

            });

    }



    /* =========================================
       PRIMEIRA ATUALIZAÇÃO
    ========================================= */

    atualizar();



    /* =========================================
       ATUALIZAÇÃO AUTOMÁTICA
       Mantido em 2 segundos
    ========================================= */

    setInterval(
        atualizar,
        2000
    );


</script>


</body>

</html>
