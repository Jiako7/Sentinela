
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema Hospitalar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef1f5;
            color: #1f2937;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            padding: 38px 35px;

            border-radius: 16px;

            border-top: 5px solid #2563eb;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           CABEÇALHO
        ========================= */

        .cabecalho {
            text-align: center;
            margin-bottom: 30px;
        }

        .icone {
            width: 62px;
            height: 62px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #eff6ff;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
        }

        h1 {
            color: #1e3a8a;
            font-size: 24px;
            margin-bottom: 7px;
        }

        .subtitulo {
            color: #6b7280;
            font-size: 14px;
        }

        /* =========================
           FORMULÁRIO
        ========================= */

        .formulario {
            display: grid;
            gap: 16px;
        }

        .campo {
            display: grid;
            gap: 7px;
        }

        .campo label {
            font-size: 13px;
            font-weight: bold;
            color: #374151;
        }

        .campo input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-family: inherit;
            font-size: 14px;

            outline: none;

            background: #ffffff;

            transition: 0.2s;
        }

        .campo input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .campo input::placeholder {
            color: #9ca3af;
        }

        /* =========================
           BOTÃO
        ========================= */

        .btn-entrar {
            width: 100%;

            border: none;
            border-radius: 8px;

            padding: 13px;

            margin-top: 4px;

            background: #2563eb;
            color: #ffffff;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .btn-entrar:hover {
            background: #1d4ed8;
        }

        .btn-entrar:active {
            transform: translateY(1px);
        }

        .btn-entrar:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            display: none;

            padding: 11px 12px;

            border-radius: 8px;

            font-size: 13px;
            font-weight: bold;

            text-align: center;
        }

        .status.erro {
            display: block;

            background: #fee2e2;
            border: 1px solid #fecaca;

            color: #991b1b;
        }

        /* =========================
           RODAPÉ
        ========================= */

        .rodape {
            margin-top: 25px;

            padding-top: 18px;

            border-top: 1px solid #e5e7eb;

            text-align: center;

            color: #9ca3af;

            font-size: 12px;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 22px;
            }
        }
    
        /* ===== Sentinela Design System v2 ===== */
        :root{
            --sn-bg:#eef4f8;
            --sn-surface:#fff;
            --sn-navy:#0b2741;
            --sn-navy2:#123f66;
            --sn-blue:#2476b8;
            --sn-blue2:#2f8fd1;
            --sn-cyan:#55b7d9;
            --sn-teal:#0f766e;
            --sn-text:#142536;
            --sn-muted:#6b7f91;
            --sn-line:#dbe6ee;
            --sn-shadow:0 18px 50px rgba(16,45,70,.10);
            --sn-shadow-soft:0 8px 24px rgba(16,45,70,.07);
        }
        body{
            font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
            background:radial-gradient(circle at 12% 0%,rgba(85,183,217,.14),transparent 28rem),linear-gradient(180deg,#f8fbfd,var(--sn-bg));
            color:var(--sn-text);
        }
        body::before{
            content:"";
            position:fixed;
            inset:0 0 auto 0;
            height:4px;
            background:linear-gradient(90deg,var(--sn-navy),var(--sn-blue2),var(--sn-cyan),var(--sn-teal));
            z-index:9999;
        }
        input,select,textarea,button{font-family:inherit}

        .container{
            max-width:450px;
            padding:42px 38px 34px;
            border-radius:22px;
            border:1px solid rgba(219,230,238,.95);
            border-top:1px solid rgba(219,230,238,.95);
            box-shadow:0 26px 70px rgba(11,39,65,.14);
            position:relative;
            overflow:hidden;
        }
        .container::before{
            content:"";
            position:absolute;
            top:0;left:0;right:0;
            height:6px;
            background:linear-gradient(90deg,var(--sn-navy),var(--sn-blue2),var(--sn-cyan));
        }
        .icone{
            width:76px;height:76px;
            background:linear-gradient(145deg,#edf8fd,#dff2fa);
            border:1px solid #cce7f2;
            box-shadow:0 12px 30px rgba(47,143,209,.13);
        }
        .icone img{width:56px;height:56px;object-fit:contain}
        h1{color:var(--sn-navy);font-size:27px;letter-spacing:-.03em}
        .subtitulo{font-size:14px;color:var(--sn-muted)}
        .campo label{color:var(--sn-navy2);font-weight:750}
        .campo input{
            min-height:48px;
            border-radius:12px;
            border-color:var(--sn-line);
            background:#fbfdfe;
        }
        .campo input:focus{border-color:var(--sn-blue2);box-shadow:0 0 0 4px rgba(47,143,209,.11);background:#fff}
        .btn-entrar{
            min-height:49px;
            border-radius:12px;
            background:linear-gradient(135deg,var(--sn-blue),var(--sn-blue2));
            box-shadow:0 12px 24px rgba(36,118,184,.20);
        }
        .btn-entrar:hover{background:linear-gradient(135deg,#1d679f,#247fba);transform:translateY(-1px)}
        .rodape{color:#8699a8;border-top-color:var(--sn-line)}

    </style>
</head>

<body>

    <main class="container">

        <div class="cabecalho">

            <div class="icone">
                <img src="logo-sh.png" alt="Sentinela">
            </div>

            <h1>Sistema Hospitalar</h1>

            <p class="subtitulo">
                Acesse sua área de atendimento
            </p>

        </div>


        <form class="formulario" onsubmit="login(event)">

            <div class="campo">

                <label for="usuario">
                    Usuário
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required>

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required>

            </div>


            <div
                id="status"
                class="status">
            </div>


            <button
                type="submit"
                id="btnEntrar"
                class="btn-entrar">

                Entrar

            </button>

        </form>


        <div class="rodape">
            Sistema Hospitalar • Acesso restrito
        </div>

    </main>


    <script>

        async function login(event) {

            event.preventDefault();

            const usuarioInput =
                document.getElementById("usuario");

            const senhaInput =
                document.getElementById("senha");

            const btnEntrar =
                document.getElementById("btnEntrar");

            const status =
                document.getElementById("status");


            const usuario =
                usuarioInput.value.trim();

            const senha =
                senhaInput.value;


            status.className = "status";
            status.textContent = "";


            if (!usuario || !senha) {

                mostrarErro(
                    "Preencha usuário e senha."
                );

                return;
            }


            btnEntrar.disabled = true;
            btnEntrar.textContent = "Entrando...";


            try {

                /*
                 * ALTERAÇÃO PRINCIPAL:
                 * A requisição agora usa a mesma origem
                 * do servidor Express.
                 */
                const resposta = await fetch(
                    "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            usuario: usuario,
                            senha: senha
                        })
                    }
                );


                const data = await resposta.json();


                if (!resposta.ok) {

                    mostrarErro(
                        data.erro ||
                        "Usuário ou senha inválidos."
                    );

                    return;
                }


                if (data.tipo === "triagem") {

                    location.href = "triagem.html";

                    return;
                }


                if (data.tipo === "medico") {

                    location.href = "medico.html";

                    return;
                }


                if (data.tipo === "atendimento") {

                    location.href = "atendimento.html";

                    return;
                }


                mostrarErro(
                    "Tipo de usuário não reconhecido."
                );


            } catch (erro) {

                console.error(
                    "Erro ao realizar login:",
                    erro
                );

                mostrarErro(
                    "Não foi possível conectar ao servidor."
                );

            } finally {

                btnEntrar.disabled = false;
                btnEntrar.textContent = "Entrar";

            }
        }


        function mostrarErro(mensagem) {

            const status =
                document.getElementById("status");

            status.textContent = mensagem;
            status.className = "status erro";

        }

    </script>

</body>
</html>
