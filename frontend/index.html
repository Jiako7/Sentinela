
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema Hospitalar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef1f5;
            color: #1f2937;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            padding: 38px 35px;

            border-radius: 16px;

            border-top: 5px solid #2563eb;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           CABEÇALHO
        ========================= */

        .cabecalho {
            text-align: center;
            margin-bottom: 30px;
        }

        .icone {
            width: 62px;
            height: 62px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #eff6ff;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
        }

        h1 {
            color: #1e3a8a;
            font-size: 24px;
            margin-bottom: 7px;
        }

        .subtitulo {
            color: #6b7280;
            font-size: 14px;
        }

        /* =========================
           FORMULÁRIO
        ========================= */

        .formulario {
            display: grid;
            gap: 16px;
        }

        .campo {
            display: grid;
            gap: 7px;
        }

        .campo label {
            font-size: 13px;
            font-weight: bold;
            color: #374151;
        }

        .campo input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-family: inherit;
            font-size: 14px;

            outline: none;

            background: #ffffff;

            transition: 0.2s;
        }

        .campo input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .campo input::placeholder {
            color: #9ca3af;
        }

        /* =========================
           BOTÃO
        ========================= */

        .btn-entrar {
            width: 100%;

            border: none;
            border-radius: 8px;

            padding: 13px;

            margin-top: 4px;

            background: #2563eb;
            color: #ffffff;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .btn-entrar:hover {
            background: #1d4ed8;
        }

        .btn-entrar:active {
            transform: translateY(1px);
        }

        .btn-entrar:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            display: none;

            padding: 11px 12px;

            border-radius: 8px;

            font-size: 13px;
            font-weight: bold;

            text-align: center;
        }

        .status.erro {
            display: block;

            background: #fee2e2;
            border: 1px solid #fecaca;

            color: #991b1b;
        }

        /* =========================
           RODAPÉ
        ========================= */

        .rodape {
            margin-top: 25px;

            padding-top: 18px;

            border-top: 1px solid #e5e7eb;

            text-align: center;

            color: #9ca3af;

            font-size: 12px;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="cabecalho">

            <div class="icone">
                🏥
            </div>

            <h1>Sistema Hospitalar</h1>

            <p class="subtitulo">
                Acesse sua área de atendimento
            </p>

        </div>


        <form class="formulario" onsubmit="login(event)">

            <div class="campo">

                <label for="usuario">
                    Usuário
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required>

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required>

            </div>


            <div
                id="status"
                class="status">
            </div>


            <button
                type="submit"
                id="btnEntrar"
                class="btn-entrar">

                Entrar

            </button>

        </form>


        <div class="rodape">
            Sistema Hospitalar • Acesso restrito
        </div>

    </main>


    <script>

        async function login(event) {

            event.preventDefault();

            const usuarioInput =
                document.getElementById("usuario");

            const senhaInput =
                document.getElementById("senha");

            const btnEntrar =
                document.getElementById("btnEntrar");

            const status =
                document.getElementById("status");


            const usuario =
                usuarioInput.value.trim();

            const senha =
                senhaInput.value;


            status.className = "status";
            status.textContent = "";


            if (!usuario || !senha) {

                mostrarErro(
                    "Preencha usuário e senha."
                );

                return;
            }


            btnEntrar.disabled = true;
            btnEntrar.textContent = "Entrando...";


            try {

                /*
                 * ALTERAÇÃO PRINCIPAL:
                 * A requisição agora usa a mesma origem
                 * do servidor Express.
                 */
                const resposta = await fetch(
                    "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            usuario: usuario,
                            senha: senha
                        })
                    }
                );


                const data = await resposta.json();


                if (!resposta.ok) {

                    mostrarErro(
                        data.erro ||
                        "Usuário ou senha inválidos."
                    );

                    return;
                }


                if (data.tipo === "triagem") {

                    location.href = "triagem.html";

                    return;
                }


                if (data.tipo === "medico") {

                    location.href = "medico.html";

                    return;
                }


                if (data.tipo === "atendimento") {

                    location.href = "atendimento.html";

                    return;
                }


                mostrarErro(
                    "Tipo de usuário não reconhecido."
                );


            } catch (erro) {

                console.error(
                    "Erro ao realizar login:",
                    erro
                );

                mostrarErro(
                    "Não foi possível conectar ao servidor."
                );

            } finally {

                btnEntrar.disabled = false;
                btnEntrar.textContent = "Entrar";

            }
        }


        function mostrarErro(mensagem) {

            const status =
                document.getElementById("status");

            status.textContent = mensagem;
            status.className = "status erro";

        }

    </script>

</body>
</html>
